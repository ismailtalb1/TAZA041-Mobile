name: taza041_flutter_customer_mobile
version: 1.0.2+3
description: Mobile-optimized TAZA 041 customer application for ordering, delivery, reservations, payments, and loyalty.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/taza041-logo.jpg
  adaptive_icon_background: "#0B0907"
  adaptive_icon_foreground: assets/images/taza041-logo.jpg
  min_sdk_android: 23

flutter_native_splash:
  color: "#0B0907"
  color_dark: "#0B0907"
  image: assets/images/taza041-logo.jpg
  image_dark: assets/images/taza041-logo.jpg
  android_12:
    color: "#0B0907"
    color_dark: "#0B0907"
    image: assets/images/taza041-logo.jpg
    image_dark: assets/images/taza041-logo.jpg
